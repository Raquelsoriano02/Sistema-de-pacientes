<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Pacientes</title>
  <meta name="description" content="Gestión de pacientes, citas, consultas y pagos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e63'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar un destello.
    try {
      const tema = localStorage.getItem('tema');
      if (tema) document.documentElement.dataset.theme = tema;
    } catch { /* sin almacenamiento: se usa el tema del sistema */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="currentColor"/></svg>
        </span>
        <span class="brand-text">Sistema de<br>Pacientes</span>
      </a>
      <nav id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="topbar-title" id="topbarTitle"></div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar tema"></button>
      </header>
      <main id="contenido" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
